<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 132" role="img" aria-label="lips" fill="currentColor">
  <title>lips</title>
  <!-- Monochrome via currentColor, self-adapting: dark ink on light
       backgrounds, light ink on dark ones (GitHub honors this media query
       inside an <svg>). Without the media query the default color still shows,
       so the mark degrades gracefully. -->
  <style>
    svg { color: #1b1f24; }
    @media (prefers-color-scheme: dark) { svg { color: #e8edf2; } }
  </style>

  <!-- The mark: a mouth whose lips are drawn out of spoken "text lines", the
       plain words a human speaks being the substance the lips are made of. The
       parentheses of the wordmark, rotated a quarter turn, are these same lips:
       Lisp's parens tipped on their side (lips vs lisp). -->
  <g transform="translate(16,26)">
    <defs>
      <!-- Union of both lips clips the text lines to the lip silhouette. -->
      <clipPath id="lips">
        <path d="M5 27 C15 12 22 8 30 8 C37 8 43 15 47 15 C51 15 57 8 64 8 C72 8 79 12 89 27 C70 22 24 22 5 27 Z"/>
        <path d="M5 29 C24 34 70 34 89 29 C78 50 62 58 47 58 C32 58 16 50 5 29 Z"/>
      </clipPath>
    </defs>

    <!-- Spoken words: ragged dashed lines, clipped into the lip shapes. -->
    <g clip-path="url(#lips)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="8"  x2="94" y2="8"  stroke-dasharray="11 5 6 6 14"/>
      <line x1="0" y1="13" x2="94" y2="13" stroke-dasharray="7 5 16 6 9"/>
      <line x1="0" y1="18" x2="94" y2="18" stroke-dasharray="14 6 9 5 10"/>
      <line x1="0" y1="23" x2="94" y2="23" stroke-dasharray="9 6 12 6 7"/>
      <line x1="0" y1="33" x2="94" y2="33" stroke-dasharray="12 5 8 6 13"/>
      <line x1="0" y1="38" x2="94" y2="38" stroke-dasharray="8 6 15 5 8"/>
      <line x1="0" y1="43" x2="94" y2="43" stroke-dasharray="13 6 7 6 11"/>
      <line x1="0" y1="48" x2="94" y2="48" stroke-dasharray="10 5 11 6 9"/>
      <line x1="0" y1="53" x2="94" y2="53" stroke-dasharray="7 6 13 5 10"/>
    </g>

    <!-- Lip outline for definition. -->
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
      <path d="M5 27 C15 12 22 8 30 8 C37 8 43 15 47 15 C51 15 57 8 64 8 C72 8 79 12 89 27 C70 22 24 22 5 27 Z"/>
      <path d="M5 29 C24 34 70 34 89 29 C78 50 62 58 47 58 C32 58 16 50 5 29 Z"/>
    </g>
  </g>

  <!-- Wordmark as a Lisp form: (lips). -->
  <text x="128" y="90" fill="currentColor"
        font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif"
        font-size="74" font-weight="600" letter-spacing="-1">(lips)</text>
</svg>
